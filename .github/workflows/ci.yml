name: 持续集成与代码检查

on:
  push:
    branches: [main]
  pull_request:

# 同一分支有新提交时，取消尚未完成的旧检查。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Android 测试与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 与缓存
        uses: gradle/actions/setup-gradle@v5

      # 保留原有策略：仅在拉取请求中执行单元测试。
      # main 推送仍执行以下静态检查；此流程不会验证实车硬件能力。
      - name: 执行单元测试（拉取请求）
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: 执行 Android Lint 检查
        run: ./gradlew :app:lintDebug --stacktrace

      - name: 执行 Kotlin detekt 检查
        run: ./gradlew :app:detekt --stacktrace

      - name: 检查失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14
